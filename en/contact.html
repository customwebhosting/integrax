<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | INTEGRAX</title>
    <style>
        /* Sjednocené definice barev z hlavní strany */
        :root {
            --ms-blue: #00a4ef;
            --ms-green: #7fba00;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-header: #0f172a;
            --bg-hero: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-card: #e2e8f0;
            --shadow: rgba(0, 0, 0, 0.05);
        }

        /* Tmavý režim podle systému */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #0b0f19;
                --bg-card: #111827;
                --text-main: #e2e8f0;
                --text-muted: #9ca3af;
                --border-card: #1f2937;
                --shadow: rgba(0, 0, 0, 0.4);
            }
            body, main, .card, .card h3, .card p {
                color: #e2e8f0 !important;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            line-height: 1.4;
            color: var(--text-main);
            background-color: var(--bg-body);
        }

        header {
            background-color: var(--bg-header);
            color: #ffffff;
            padding: 0.75rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            /* Pruh pod hlavičkou byl kompletně odstraněn */
            border-bottom: none; 
        }

        header .logo {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
        }

        nav {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        nav a {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--ms-blue);
        }

        .lang-switch {
            font-weight: bold;
            color: #ffffff !important;
        }

        main {
            max-width: 600px;
            margin: 0 auto;
            padding: 3rem 1rem;
            text-align: center;
        }

        .page-title {
            margin-bottom: 0.25rem;
            font-size: 2rem;
            color: var(--text-main);
        }

        .company-name {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 2.5rem;
            color: var(--ms-blue);
        }

        .card {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid var(--border-card);
            box-shadow: 0 4px 6px -1px var(--shadow);
            text-align: left;
        }

        .card h3 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--border-card);
            padding-bottom: 0.5rem;
            color: var(--ms-blue);
        }

        .card p {
            font-size: 0.95rem;
            margin-bottom: 0.75rem;
            color: var(--text-main);
        }

        .card p strong {
            color: var(--text-muted);
            display: inline-block;
            width: 110px;
        }

        .card .email-block {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px dashed var(--border-card);
        }

        /* Antispam ochrana pro e-mail */
        .safe-email {
            unicode-bidi: bidi-override;
            direction: rtl;
            font-weight: 600;
        }

        footer {
            background-color: var(--bg-header);
            color: var(--text-hero-p);
            text-align: center;
            padding: 1rem;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            font-size: 0.8rem;
            border-top: 1px solid var(--border-card);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">INTEGRAX</div>
        <nav>
            <a href="../en/index.html">← Back to Services</a>
            <a href="../contact.html" class="lang-switch">CZ</a>
        </nav>
    </header>

    <main>
        <h1 class="page-title">Contact Information</h1>
       
        <div class="card">
            <h3>Billing Details</h3>
            <p><strong>Company:</strong> INTEGRAX Consulting Services s.r.o.</p>
            <p><strong>Address:</strong> Na dolinach 1272/41, 140 00 Prague</p>
            <p><strong>CIN:</strong> 08988391</p>
            <p><strong>TIN:</strong> CZ08988391</p>

            <div class="email-block">
                <h3>Get in Touch</h3>
                <p><strong>Email:</strong> info (at) integrax.cz</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 INTEGRAX. All rights reserved.</p>
    </footer>

</body>
</html>
